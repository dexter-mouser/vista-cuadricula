<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vista en cuadrícula</title>
  <meta name="description" content="Hoja cuadriculada con la foto detrás para copiar una vista en un cuaderno.">
  <meta name="theme-color" content="#efece3" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#17191c" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icono.svg" type="image/svg+xml">
  <link rel="icon" href="icons/icono-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="cabecera">
    <div>
      <h1>Vista en cuadrícula</h1>
      <p>Pon el cuaderno de lado y copia la foto cuadro por cuadro: cada cuadro de la pantalla es un cuadro de tu hoja (52 × 34).</p>
    </div>

    <!-- Botón claro/oscuro -->
    <button type="button" class="boton-tema" id="botonTema">
      <svg class="icono-luna" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z" />
      </svg>
      <svg class="icono-sol" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="4" />
        <path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
      </svg>
      <span class="boton-tema__texto">Tema oscuro</span>
    </button>
  </header>

  <main class="contenedor">
    <!-- Hoja cuadriculada con la foto detrás -->
    <figure class="hoja">
      <div class="desplazable">
        <div class="tablero">
          <div class="regla regla--superior" id="reglaSuperior" aria-hidden="true"></div>
          <div class="regla regla--lateral" id="reglaLateral" aria-hidden="true"></div>
          <div class="lienzo" id="lienzo">
            <img class="foto-fondo" id="fotoFondo" src="img/vista.jpg" alt="Vista desde una ventana: cortina clara a la derecha, edificio de ladrillo en esquina, palmera y cielo con nubes" width="2000" height="1500">
          </div>
        </div>
      </div>

      <figcaption>
        <label class="control-foto" for="transparenciaFoto">Foto visible</label>
        <input type="range" id="transparenciaFoto" min="0" max="100" step="5" value="50">
        <output id="valorTransparencia" for="transparenciaFoto">50 %</output>
        <button type="button" class="boton-foto" id="botonRestablecerTransparencia">Restablecer 50 %</button>

        <!-- Elegir otra foto (se guarda en el navegador) -->
        <button type="button" class="boton-foto" id="botonCambiarFoto">Cambiar foto</button>
        <input type="file" id="archivoFoto" accept="image/*" hidden>
        <p class="aviso-foto" id="avisoFoto" role="status"></p>
      </figcaption>
    </figure>
  </main>

  <script src="app.js"></script>
</body>
</html>
